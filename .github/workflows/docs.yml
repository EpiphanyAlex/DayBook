# 文档门禁。代码门禁（前端四条 + Rust 三条）在 ci.yml，见文件末尾的注释。
#
# 依据：仓库根 CLAUDE.md 约束 16「前端与 Rust 门禁并列，任一失败即红」——
# 文档门禁同样是并列的一条，不是次要项。
name: docs

on:
  push:
    branches: [main]
  pull_request:

# 只读即可：本 workflow 不写回仓库、不发布任何产物。
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 文档门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-readme-sync.mjs 按**提交历史的祖先关系**判定英文镜像有没有落后
          # （不看时间戳——时间戳只到秒且会被 rebase 重写）。默认的浅克隆
          # （fetch-depth: 1）没有历史可查，脚本会直接报错而不是误判。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 刻意不装依赖：四个脚本零依赖、只用 node: 内置模块，
      # 因此不需要 package.json / lockfile（仓库目前也还没有）。

      - name: docs/prd 自检（frontmatter + 链接）
        run: node docs/prd/check-docs.mjs

      - name: 全仓库 Markdown 链接检查
        run: node scripts/check-links.mjs

      - name: README 中英同步检查
        run: node scripts/check-readme-sync.mjs

      - name: 规格不变式检查（决策漂移）
        run: node scripts/check-spec-invariants.mjs

# ── 代码门禁在 ci.yml ─────────────────────────────────────────────
#
# 本文件此前在这里留了「待建：00 基础设施落地后在此并列增加两个 job」的计划。
# M0 落地后代码门禁改放独立的 ci.yml：本文件跑 4 秒、只依赖 node 内置模块，
# 而代码门禁要装 Rust 工具链与 npm 依赖、跑在 macos-latest 上。分开之后
# 文档改动仍然几秒就有反馈，且 CLAUDE.md 与两份 README 里对 docs.yml
# 「跑那四条」的描述保持成立。
#
# 明确不进 CI（依据 docs/prd/07-eval.md §3.1 与 §4）：
#   - eval 跑批：每轮烧订阅额度，且 CI 环境没有已登录的 agent CLI
#   - 任何调用 agent CLI 的步骤（同上）
#   - 真实夹具：含真实截图与真实金额，不进 git（07-eval §3.7）
