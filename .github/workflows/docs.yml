# 文档门禁。仓库当前处于骨架阶段（src/ 与 src-tauri/ 尚未创建），
# 因此这里只有文档一套 job；代码门禁的位置见文件末尾的注释。
#
# 依据：仓库根 CLAUDE.md 约束 16「前端与 Rust 门禁并列，任一失败即红」——
# 文档门禁同样是并列的一条，不是次要项。
name: docs

on:
  push:
    branches: [main]
  pull_request:

# 只读即可：本 workflow 不写回仓库、不发布任何产物。
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 文档门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 刻意不装依赖：两个脚本零依赖、只用 node: 内置模块，
      # 因此不需要 package.json / lockfile（仓库目前也还没有）。

      - name: docs/prd 自检（frontmatter + 链接）
        run: node docs/prd/check-docs.mjs

      - name: 全仓库 Markdown 链接检查
        run: node scripts/check-links.mjs

# ── 待建：00 基础设施 落地后在此并列增加两个 job ──────────────────
#
#   frontend:
#     - npm ci
#     - npm run lint
#     - npm run typecheck
#     - npm test
#     - npm run build
#
#   rust:（working-directory: src-tauri）
#     - cargo fmt --all -- --check
#     - cargo clippy --all-targets --all-features -- -D warnings
#     - cargo test
#
# 明确不进 CI（依据 docs/prd/07-eval.md §3.1 与 §4）：
#   - eval 跑批：每轮烧订阅额度，且 CI 环境没有已登录的 agent CLI
#   - 任何调用 agent CLI 的步骤（同上）
#   - 真实夹具：含真实截图与真实金额，不进 git（07-eval §3.7）
# 可以进 CI 的是夹具重放（07-eval §3.6，零额度、确定性），
# 但它依赖 src-tauri/ 存在，等基础设施落地后再加。
