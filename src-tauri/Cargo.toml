[package]
name = "daybook"
version = "0.1.0"
description = "Daybook local-first retrospective recorder"
authors = ["Daybook contributors"]
edition = "2021"
rust-version = "1.85"
# MCP helper 是第二个 bin（daybook-mcp），没有这一行 `cargo run` 不知道该起哪个，
# `npm run tauri dev` / `tauri build` 会直接失败在「could not determine which binary to run」。
default-run = "daybook"

[lib]
name = "daybook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
libc = "0.2"
png = "=0.17.16"
rmcp = { version = "=3.1.2", features = ["transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
